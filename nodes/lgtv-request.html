<script type="text/javascript">
    RED.nodes.registerType('lgtv-request', {
        category: 'lgtv',
        color: '#C0DEED',
        inputs: 1,
        outputs: 1,
        defaults: {
            tv: {
                value: '',
                type: 'lgtv-config',
                required: true
            },
            name: {
                value: ''
            }
        },
        label() {
            return this.name || 'request';
        },
        icon: 'bridge-dash.png',
        paletteLabel: 'request'
    });
</script>

<script type="text/x-red" data-template-name="lgtv-request">
    <div class="form-row">
        <label for="node-input-tv"><i class="icon-bookmark"></i> TV</label>
        <input type="text" id="node-input-tv">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="icon-bookmark"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/x-red" data-help-name="lgtv-request">
    <p>Send arbitrary requests to the API</p>
    <p><code>msg.topic</code> is the API URL. Example: <code>ssap://com.webos.applicationManager/listLaunchPoints</code></p>
    <p><code>msg.payload</code> is the request payload (an object); anything else is sent as an empty payload.</p>
    <p>
        The response replaces <code>msg.payload</code> on the output. Errors (TV not connected, or an error answer
        from the TV such as <i>404 no such service or method</i>) are reported via <code>node.error</code> and can be
        handled with a catch node.
    </p>
    <p>
        A list of endpoints is in the <a href="https://github.com/hobbyquaker/lgtv2#commands" target="_blank">lgtv2
        README</a>.
    </p>
</script>
